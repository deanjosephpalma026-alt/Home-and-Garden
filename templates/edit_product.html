<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product | Home And Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='house.png') }}">
  <style>
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="bg-white min-h-screen py-8">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="mb-12">
      <a href="{{ url_for('seller.seller_dashboard') }}" class="inline-flex items-center gap-2 text-sm font-light text-gray-600 hover:text-gray-900 mb-6 underline underline-offset-4">
        ← Back to Dashboard
      </a>
      <h1 class="text-4xl font-light tracking-tight text-gray-900 mb-2">Edit Product</h1>
      <p class="text-sm font-light text-gray-600">Update product information</p>
    </div>

    
    <form action="/update_product?product_id={{ product.id }}" method="POST" enctype="multipart/form-data" class="space-y-6">
      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Product Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" value="{{ product.name }}" required
               class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Price (₱) <span class="text-red-500">*</span></label>
        <input type="number" name="price" step="0.01" value="{{ product.price }}" required
               class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Current Stock</label>
          <input type="number" id="currentStock" value="{{ product.stock }}" readonly
                 class="w-full px-4 py-3 border border-gray-300 bg-gray-50 text-gray-600 text-sm font-light">
        </div>
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Add More Stock</label>
          <input type="number" id="addStock" name="add_stock" value="0" min="0"
                 class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">New Total Stock</label>
        <input type="number" id="newTotalStock" readonly
               class="w-full px-4 py-3 border border-gray-300 bg-gray-50 text-gray-600 text-sm font-light">
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Category <span class="text-red-500">*</span></label>
        <select name="category" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition" required>
          <option value="Bedding and Bath" {% if product.category == 'Bedding and Bath' %}selected{% endif %}>Bedding and Bath</option>
          <option value="Furniture and Decor" {% if product.category == 'Furniture and Decor' %}selected{% endif %}>Furniture and Decor</option>
          <option value="Gardening Tools" {% if product.category == 'Gardening Tools' %}selected{% endif %}>Gardening Tools</option>
          <option value="Home Improvement Tools" {% if product.category == 'Home Improvement Tools' %}selected{% endif %}>Home Improvement Tools</option>
          <option value="Kitchen Appliances" {% if product.category == 'Kitchen Appliances' %}selected{% endif %}>Kitchen Appliances</option>
          <option value="Outdoor Living" {% if product.category == 'Outdoor Living' %}selected{% endif %}>Outdoor Living</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Size Options</label>
          <input type="text" name="size_options" value="{{ product.size_options or '' }}" placeholder="Small, Medium, Large"
                 class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Color Options</label>
          <input type="text" name="color_options" value="{{ product.color_options or '' }}" placeholder="White, Black, Beige"
                 class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Description</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition resize-none">{{ product.description }}</textarea>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Current Image</label>
        <img src="{{ url_for('static', filename=product.image.replace('static/', '')) }}" 
             alt="Product Image" 
             class="w-full h-64 object-cover border border-gray-200 mb-4">
        <input type="file" name="image" accept="image/*"
               class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
      </div>

      <div class="flex gap-4 pt-6 border-t border-gray-200">
        <a href="{{ url_for('seller.seller_dashboard') }}" 
           class="flex-1 border border-gray-900 text-gray-900 py-3.5 text-sm font-light text-center hover:bg-gray-900 hover:text-white transition">
          Cancel
        </a>
        <button type="submit" 
                class="flex-1 bg-gray-900 text-white py-3.5 text-sm font-light hover:bg-gray-800 transition">
          Save Changes
        </button>
      </div>
    </form>

    
    <form action="/delete_product?product_id={{ product.id }}"
          method="POST" 
          onsubmit="return confirm('Are you sure you want to delete this product?');" 
          class="mt-8 pt-8 border-t border-gray-200">
      <button type="submit" 
              class="w-full border border-red-600 text-red-600 py-3.5 text-sm font-light hover:bg-red-600 hover:text-white transition">
        Delete Product
      </button>
    </form>
  </div>

  <script>
    const currentStock = document.getElementById("currentStock");
    const addStock = document.getElementById("addStock");
    const newTotalStock = document.getElementById("newTotalStock");

    function updateStockTotal() {
      const current = parseInt(currentStock.value || 0);
      const add = parseInt(addStock.value || 0);
      newTotalStock.value = current + add;
    }

    addStock.addEventListener("input", updateStockTotal);
    updateStockTotal();
  </script>
</body>
</html>
