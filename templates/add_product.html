<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Home And Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='house.png') }}">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="bg-white min-h-screen py-8">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-12">
      <a href="{{ url_for('seller.seller_dashboard') }}" class="inline-flex items-center gap-2 text-sm font-light text-gray-600 hover:text-gray-900 mb-6 underline underline-offset-4">
        ← Back to Dashboard
      </a>
      <h1 class="text-4xl font-light tracking-tight text-gray-900 mb-2">Add Product</h1>
      <p class="text-sm font-light text-gray-600">Create a new listing for your shop</p>
    </div>

    <form action="{{ url_for('seller.add_product') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Product Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" required class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Price (₱) <span class="text-red-500">*</span></label>
          <input type="number" name="price" step="0.01" required class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Stock <span class="text-red-500">*</span></label>
          <input type="number" name="stock" min="0" required class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Category <span class="text-red-500">*</span></label>
        <select name="category" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition" required>
          <option value="">Select category</option>
          <option value="Bedding and Bath">Bedding and Bath</option>
          <option value="Furniture and Decor">Furniture and Decor</option>
          <option value="Gardening Tools">Gardening Tools</option>
          <option value="Home Improvement Tools">Home Improvement Tools</option>
          <option value="Kitchen Appliances">Kitchen Appliances</option>
          <option value="Outdoor Living">Outdoor Living</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Size Options</label>
          <input type="text" name="size_options" placeholder="Small, Medium, Large" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
        <div>
          <label class="block text-sm font-light text-gray-700 mb-2">Color Options</label>
          <input type="text" name="color_options" placeholder="White, Black, Beige" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
        </div>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Description</label>
        <textarea name="description" rows="4" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition resize-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-light text-gray-700 mb-2">Product Image</label>
        <input type="file" name="image" accept="image/*" class="w-full px-4 py-3 border border-gray-300 text-sm font-light focus:outline-none focus:border-gray-900 transition">
      </div>

      <div class="flex gap-4 pt-6 border-t border-gray-200">
        <a href="{{ url_for('seller.seller_dashboard') }}" class="flex-1 border border-gray-900 text-gray-900 py-3.5 text-sm font-light text-center hover:bg-gray-900 hover:text-white transition">Cancel</a>
        <button type="submit" class="flex-1 bg-gray-900 text-white py-3.5 text-sm font-light hover:bg-gray-800 transition">Add Product</button>
      </div>
    </form>
  </div>
</body>
</html>
